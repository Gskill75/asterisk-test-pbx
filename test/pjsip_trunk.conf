; pjsip_trunk.conf
; Test bench override of ../config/pjsip_trunk.conf: the carrier is simulated
; by SIPp on 127.0.0.2, there is no registration nor authentication. Keep the
; settings applying to inbound calls in line with ../config/pjsip_trunk.conf.

[trunk]
type = aor

[trunk]
type = endpoint
transport = trunk
context = from-trunk
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
aors = trunk
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
inband_progress = @PBX_PREANSWER@

[trunk]
type = identify
endpoint = trunk
match = @TRUNK_HOST@
