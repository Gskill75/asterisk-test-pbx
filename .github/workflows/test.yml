name: test

# Build the images and run the pre-answer test bench, see README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CTR=docker build
      - name: Test
        run: make CTR=docker test
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: test/out/
