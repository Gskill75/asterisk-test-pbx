; pjsip_trunk.conf
; SIP trunk registering to the provider, removed at start when TRUNK_HOST is
; empty. Inbound calls enter the dialplan in context from-trunk.
;
; TRUNK_HOST is the SIP domain of the line, TRUNK_USER the line number alone,
; without @domain. When the provider has a distinct SBC, TRUNK_PROXY, all the
; trunk traffic goes through it as outbound proxy (lines removed when empty).

[trunk]
type = registration
transport = trunk
outbound_auth = trunk
server_uri = sip:@TRUNK_HOST@
client_uri = sip:@TRUNK_USER@@@TRUNK_HOST@
contact_user = @TRUNK_USER@
outbound_proxy = sip:@TRUNK_PROXY@\;lr
; We may be behind NAT, possibly a mobile carrier one closing idle UDP
; mappings after ~30s: re-register often, which also recovers from host
; network changes.
expiration = 300
retry_interval = 60
; Do not hammer the provider after a 403 or a wrong password, it might lock
; the line out.
forbidden_retry_interval = 600
fatal_retry_interval = 600
max_retries = 10
; Identify inbound calls by the line parameter of our Contact, the provider
; might send them from other addresses than TRUNK_HOST.
line = yes
endpoint = trunk

[trunk]
type = auth
auth_type = userpass
username = @TRUNK_USER@
password = @TRUNK_PASSWORD@

[trunk]
type = aor
contact = sip:@TRUNK_HOST@
outbound_proxy = sip:@TRUNK_PROXY@\;lr
; Keep the NAT mapping alive
qualify_frequency = 15

[trunk]
type = endpoint
transport = trunk
context = from-trunk
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
outbound_auth = trunk
aors = trunk
from_user = @TRUNK_USER@
from_domain = @TRUNK_HOST@
outbound_proxy = sip:@TRUNK_PROXY@\;lr
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Without pre-answer music, no, so that ringing is a plain 180 Ringing, yes
; would turn it into a 183 with in-band ringing. With pre-answer music, early
; media is already up and Asterisk relays ringing in-band whatever this is.
inband_progress = @PBX_PREANSWER@

[trunk]
type = identify
endpoint = trunk
match = @TRUNK_HOST@
match = @TRUNK_PROXY@
