; extensions.conf
; Dialplan: internal calls, test services, SIP trunk in and out.

[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[globals]
; Extension ringing for inbound trunk calls
INBOUND_EXTEN = @INBOUND_EXTEN@
; Pre-answer music played to inbound trunk callers, yes or no
PREANSWER = @PBX_PREANSWER@
PREANSWER_SOUND = custom/predecroche

;-------------------------------- phones ---------------------------------------

[from-internal]
exten => _10[0-2],1,Verbose(2,Internal call from ${CALLERID(all)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Test services: 600 echo test, 601 hello world, 602 music on hold,
; 603 speaking clock, 604 pre-answer music
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 601,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

exten => 602,1,Answer()
 same => n,MusicOnHold(,60)
 same => n,Hangup()

exten => 603,1,Answer()
 same => n,SayUnixTime(,Europe/Paris,ABdY 'digits/at' IMp)
 same => n,Hangup()

exten => 604,1,Answer()
 same => n,Playback(${PREANSWER_SOUND})
 same => n,Hangup()

; Outbound through the trunk, numbers as dialed: national 0XXXXXXXXX,
; international 00... or +...
exten => _0[1-9]XXXXXXXX,1,Goto(to-trunk,${EXTEN},1)
exten => _00X.,1,Goto(to-trunk,${EXTEN},1)
exten => _+X.,1,Goto(to-trunk,${EXTEN},1)

[to-trunk]
exten => _[+0-9].,1,Verbose(2,Outbound call from ${CALLERID(all)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk,60)
 same => n,Congestion()

;-------------------------------- SIP trunk ------------------------------------
; Inbound calls, whatever the dialed number, ring INBOUND_EXTEN.
; When PREANSWER is yes, the caller first hears PREANSWER_SOUND as early media
; (183 Session Progress with SDP), the call is not answered. Then
; INBOUND_EXTEN is dialed and, early media being already up, Asterisk relays
; its ringing as in-band ringback tone, not as 180 Ringing.
; Otherwise ringing is a plain 180 Ringing without SDP: some providers ignore
; 183, the caller would then hear nothing until the call is answered.

[from-trunk]
exten => _[+0-9a-zA-Z].,1,Verbose(2,Inbound trunk call from ${CALLERID(all)} to ${EXTEN})
 same => n,GotoIf($["${PREANSWER}" != "yes"]?dial)
 same => n,Progress()
 same => n,Playback(${PREANSWER_SOUND},noanswer)
 same => n,Verbose(2,Pre-answer playback status: ${PLAYBACKSTATUS})
 same => n(dial),Dial(PJSIP/${INBOUND_EXTEN},30)
 same => n,Hangup()

exten => s,1,Goto(${CONTEXT},inbound,1)
