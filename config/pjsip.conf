; pjsip.conf
; Three internal extensions, 100, 101 and 102, and the SIP trunk, included
; from pjsip_trunk.conf when TRUNK_HOST is set.
; The @...@ placeholders are replaced at start by the entrypoint, with the
; values of .env.

[global]
type = global
user_agent = Asterisk test PBX

;-------------------------------- transports -----------------------------------
; Phones: UDP and TCP 5060. PBX_EXTERNAL_IP is the address they reach the PBX
; at, 127.0.0.1 when they run on the host, the host LAN address otherwise.

[transport-phones](!)
type = transport
bind = 0.0.0.0:5060
external_signaling_address = @PBX_EXTERNAL_IP@
external_media_address = @PBX_EXTERNAL_IP@
tos = cs3
cos = 3

[udp](transport-phones)
protocol = udp

[tcp](transport-phones)
protocol = tcp

; The SIP trunk uses its own transport, not published, so that the address
; advertised to the phones is not advertised to the provider: we reach it
; through NAT, it answers thanks to rport and the qualify keep-alive.
; TRUNK_EXTERNAL_IP is advertised in the SDP (removed when empty). Behind NAT
; the RTP ports are rewritten anyway: providers usually latch onto our RTP
; source once the call is answered, but some drop early media (183) not
; coming from the advertised address.
[trunk]
type = transport
protocol = udp
bind = 0.0.0.0:5070
external_media_address = @TRUNK_EXTERNAL_IP@
tos = cs3
cos = 3

;-------------------------------- phones ---------------------------------------

[phone](!)
type = endpoint
context = from-internal
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Accept SRTP (SDES) offers from softphones, eg Linphone, without requiring it
media_encryption = sdes
media_encryption_optimistic = yes

[phone-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30
; Contacts are lost when the container is recreated, so have the phones
; re-register often.
maximum_expiration = 120

[phone-auth](!)
type = auth
auth_type = userpass

; The section name is the SIP user name the phone registers with.

[100](phone)
auth = 100
aors = 100
callerid = Poste 100 <100>
[100](phone-auth)
username = 100
password = @SIP_PASSWORD_100@
[100](phone-aor)

[101](phone)
auth = 101
aors = 101
callerid = Poste 101 <101>
[101](phone-auth)
username = 101
password = @SIP_PASSWORD_101@
[101](phone-aor)

[102](phone)
auth = 102
aors = 102
callerid = Poste 102 <102>
[102](phone-auth)
username = 102
password = @SIP_PASSWORD_102@
[102](phone-aor)

;-------------------------------- SIP trunk ------------------------------------

#tryinclude pjsip_trunk.conf
